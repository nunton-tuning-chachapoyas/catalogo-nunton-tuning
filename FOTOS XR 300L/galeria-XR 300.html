<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>AMX F25 · Galería</title>
    <!-- Fuente: Unbounded -->
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           VARIABLES Y RESET GLOBAL
           ========================================= */
        :root {
            /* Colores Modo Claro (Light Theme) */
            --bg: #fff;
            --card: #fff;
            --line: #e4e4e7;
            --ink: #111;
            --mut: #71717a;
            --red: #ff1a1a;
            
            /* Colores Modo Oscuro (Dark Theme por defecto) */
            --m-bg: #0b0b0d;
            --m-pan: #000;
            --m-line: #2a2a2e;
            
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* Ajuste para preferencia de sistema o forzado a dark */
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0e0e10;
                --card: #151518;
                --line: #2a2a2e;
                --ink: #f4f4f5;
                --mut: #a1a1aa;
            }
        }
        
        :root[data-theme="dark"] {
            --bg: #0e0e10;
            --card: #151518;
            --line: #2a2a2e;
            --ink: #f4f4f5;
            --mut: #a1a1aa;
        }

        * { box-sizing: inherit; }
        
        html { scroll-padding-top: env(safe-area-inset-top, 0px); }
        
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Unbounded', system-ui, sans-serif;
            min-height: 100vh;
        }

        /* =========================================
           CONTENEDOR PRINCIPAL Y GRID
           ========================================= */
        .wrap {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 20px 120px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 14px;
        }

        @media (max-width: 1100px) {
            .grid { grid-template-columns: repeat(4, 1fr); }
        }
        
        @media (max-width: 640px) {
            .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }

        /* =========================================
           TARJETAS (DISEÑOS)
           ========================================= */
        .card {
            position: relative;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 10px 10px 12px;
            cursor: pointer;
            overflow: hidden;
            transition: transform .35s cubic-bezier(.2,.8,.2,1), box-sizing .35s, border-color .3s;
            animation: pop .5s cubic-bezier(.2,.8,.2,1) both;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 30px -12px rgba(0,0,0,.35);
            border-color: var(--red);
        }

        .card:focus-visible {
            outline: 2px solid var(--red);
            outline-offset: 2px;
        }

        .thumb {
            aspect-ratio: 4/3;
            display: grid;
            place-items: center;
        }

        .thumb img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform .5s cubic-bezier(.2,.8,.2,1);
        }

        .card:hover .thumb img {
            transform: scale(1.07) rotate(-1deg);
        }

        .meta {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            font-size: 10px;
            font-weight: 700;
            padding: 6px 6px 0;
        }

        .meta span:last-child { color: var(--mut); }

        /* Botón de eliminar (papelera) */
        .del {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 0;
            background: rgba(0,0,0,.6);
            color: #fff;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            opacity: 0;
            transform: scale(.7);
            transition: .25s;
        }

        .card:hover .del, .del:focus-visible {
            opacity: 1;
            transform: none;
        }

        @keyframes pop {
            from { opacity: 0; transform: translateY(22px) scale(.94); }
            to { opacity: 1; transform: none; }
        }

        /* Estado de tarjeta vacía (cuando falta imagen) */
        .slot {
            border-style: dashed;
            background: transparent;
        }
        
        .slot .thumb {
            color: var(--mut);
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            gap: 6px;
            align-content: center;
        }
        
        .slot .thumb b {
            display: block;
            font-size: 34px;
            font-weight: 500;
            line-height: 1;
            transition: .3s;
        }
        
        .slot:hover .thumb b {
            transform: rotate(90deg) scale(1.2);
            color: var(--red);
        }

        .rep { right: 40px; }

        /* Estado de arrastrar archivo */
        .empty {
            border: 2px dashed var(--line);
            border-radius: 24px;
            padding: 70px 20px;
            text-align: center;
            color: var(--mut);
            font-size: 13px;
            transition: .3s;
        }
        
        .empty b {
            display: block;
            color: var(--ink);
            font-size: 18px;
            margin-bottom: 8px;
        }

        body.drag .empty, body.drag .grid {
            outline: 3px dashed var(--red);
            outline-offset: 8px;
        }

        /* =========================================
           BARRA INFERIOR (DOCK)
           ========================================= */
        .dock {
            position: fixed;
            justify-content: center;
            left: 50%;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 22px;
            padding: 10px;
            border-radius: 26px;
            background: rgba(60,60,64,.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 12px 40px rgba(0,0,0,.35);
            z-index: 5;
        }

        .dock .brand {
            color: #fff;
            font-size: 15px;
            font-weight: 900;
            padding: 8px 22px;
            white-space: nowrap;
        }
        
        .dock .brand small { font-size: 9px; color: #bbb; margin-right: 8px; }

        .ibtn {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,.22);
            background: rgba(255,255,255,.1);
            color: #fff;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: .25s;
        }
        
        .ibtn:hover {
            background: var(--red);
            border-color: var(--red);
            transform: scale(1.08);
        }
        
        .ibtn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* =========================================
           VENTANA MODAL (DETALLE)
           ========================================= */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: none;
            place-items: center;
            padding: 20px;
            background: rgba(0,0,0,.82);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        
        .modal.open { display: grid; animation: fade .3s both; }

        .box {
            width: min(1100px, 100%);
            height: min(720px, 88vh);
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            background: var(--m-bg);
            color: #f4f4f5;
            border: 1px solid var(--m-line);
            border-radius: 26px;
            overflow: hidden;
            animation: zoom .45s cubic-bezier(.2,.9,.25,1.1) both;
        }

        @keyframes fade { from { opacity: 0; } }
        @keyframes zoom { from { opacity: 0; transform: scale(.85) translateY(30px); } }

        /* Lado izquierdo: Visualización de imagen */
        .stage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            min-height: 0;
            padding: 20px;
        }

        .glow {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: blur(70px) saturate(1.6);
            opacity: .35;
            transition: background-image .4s;
        }

        .view {
            position: relative;
            flex: 1;
            width: 100%;
            min-height: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            cursor: zoom-in;
        }
        
        .view img {
            max-width: 92%;
            max-height: 100%;
            object-fit: contain;
            transition: transform .3s;
        }

        .view.zoom { cursor: zoom-out; }
        .view.zoom img { transform: scale(1.7); }

        /* Navegación (flechas) */
        .nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(0,0,0,.6);
            border: 1px solid var(--m-line);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            z-index: 2;
            transition: .25s;
        }
        
        .nav:hover { background: var(--red); border-color: var(--red); scale: 1.12; }
        .nav.l { left: 10px; }
        .nav.r { right: 10px; }

        /* Tira de miniaturas inferior */
        .strip {
            position: relative;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            max-width: 100%;
            padding: 10px 4px 2px;
        }
        
        .strip img {
            width: 58px;
            height: 48px;
            object-fit: contain;
            background: #111;
            border: 2px solid var(--m-line);
            border-radius: 10px;
            cursor: pointer;
            flex: none;
            opacity: .6;
            transition: .25s;
        }
        
        .strip img:hover { opacity: 1; transform: translateY(-3px); }
        .strip img.on { border-color: var(--red); opacity: 1; }

        /* Lado derecho: Información y acciones */
        .info {
            background: var(--m-pan);
            border-left: 1px solid var(--m-line);
            padding: 26px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            overflow-y: auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 700;
            color: var(--mut);
        }
        
        .info h2 {
            margin: 0;
            font-size: clamp(20px, 2.6vw, 32px);
            font-weight: 900;
            letter-spacing: -.03em;
            word-break: break-all;
            line-height: 1.1;
        }

        /* Sección de compra */
        .buy {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            padding-top: 16px;
            border-top: 1px solid var(--m-line);
        }

        .cta {
            flex: 1;
            min-width: 140px;
            border: 0;
            border-radius: 99px;
            background: var(--red);
            color: #fff;
            font: 900 12px 'Unbounded', sans-serif;
            padding: 17px 20px;
            cursor: pointer;
            transition: .25s;
        }
        
        .cta:hover { transform: scale(1.04); box-shadow: 0 8px 24px rgba(255,26,26,.5); }

        .price s { color: var(--mut); font-size: 11px; margin-right: 6px; }
        .price b { font-size: 26px; }
        .price i {
            font-style: normal;
            background: var(--red);
            border-radius: 6px;
            font-size: 9px;
            padding: 3px 5px;
            margin-left: 6px;
            font-weight: 900;
        }

        /* Etiquetas y Opciones */
        .tags { display: flex; gap: 8px; flex-wrap: wrap; }
        .tags span {
            font-size: 9px;
            font-weight: 700;
            border: 1px solid var(--m-line);
            border-radius: 99px;
            padding: 6px 10px;
            color: #d4d4d8;
        }

        .info label { font-size: 10px; font-weight: 700; color: var(--mut); }

        select {
            width: 100%;
            margin-top: 8px;
            background: transparent;
            color: #fff;
            border: 1px solid var(--m-line);
            border-radius: 12px;
            padding: 14px;
            font: 700 12px 'Unbounded', sans-serif;
        }

        .share {
            background: transparent;
            color: #fff;
            border: 1px solid var(--m-line);
            border-radius: 12px;
            padding: 14px;
            font: 700 11px 'Unbounded', sans-serif;
            cursor: pointer;
            transition: .25s;
        }
        
        .share:hover { border-color: #fff; }

        /* Botón cerrar modal flotante */
        .close {
            position: fixed;
            top: calc(16px + env(safe-area-inset-top, 0px));
            right: 16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 0;
            background: #222;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            z-index: 30;
            transition: .25s;
        }
        
        .close:hover { background: var(--red); transform: rotate(90deg); }

        /* =========================================
           RESPONSIVE Y UTILIDADES
           ========================================= */
        @media (max-width: 760px) {
            .box { grid-template-columns: 1fr; grid-template-rows: 55% 45%; height: 92vh; }
            .info { border-left: 0; border-top: 1px solid var(--m-line); padding: 18px; }
            .dock { gap: 10px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<style>
/* Marca de agua PNG: sobre todas las fotos, sin alterar archivos */
        /* CAMBIA AQUÍ LA OPACIDAD: 0 = invisible, 0.45 = 45%, 1 = 100% */
        :root { --watermark-opacity: 0.90; }
        .thumb { position: relative; overflow: hidden; }
        .thumb::after, .view::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("marca%20de%20agua.png");
            background-repeat: no-repeat;
            background-position: center 12%;
            background-size: 75% auto;
            opacity: var(--watermark-opacity);
            pointer-events: none;
            z-index: 1;
        }
        .thumb::after { background-size: 72% auto; background-position: center 12%; }
        .slot .thumb::after { display: none; }
        .view::after { background-size: 75% auto; }
        @media (max-width: 760px) { .view::after { background-size: 75% auto; } }
        #modal:fullscreen .view::after { background-size: 65% auto; background-position: center 12%; }


        /* Controles del modal: cerrar y pantalla completa */
        .modal-actions { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; align-items: center; z-index: 1000; }
        .modal-actions .close, .modal-actions .fullscreen { position: static; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .modal-actions .fullscreen { background: #111; color: #fff; border: 1px solid #444; border-radius: 50%; font-size: 24px; }
        .modal-actions .fullscreen:hover { background: #333; }
        /* Pantalla completa: la fotografía utiliza todo el espacio disponible. */
        #modal:fullscreen { display: block !important; position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100vh !important; margin: 0 !important; padding: 0 !important; background: #000 !important; overflow: hidden !important; }
        #modal:fullscreen .box, #modal:fullscreen .stage, #modal:fullscreen .view { position: absolute !important; inset: 0 !important; width: 100% !important; height: 100% !important; max-width: none !important; max-height: none !important; min-width: 0 !important; margin: 0 !important; padding: 0 !important; border: 0 !important; border-radius: 0 !important; transform: none !important; }
        #modal:fullscreen .view { display: flex !important; align-items: center !important; justify-content: center !important; overflow: hidden !important; background: #000 !important; }
        #modal:fullscreen #big { display: block !important; width: 100% !important; height: 100% !important; max-width: none !important; max-height: none !important; object-fit: contain !important; object-position: center !important; transform: none !important; }
        #modal:fullscreen .info, #modal:fullscreen .strip, #modal:fullscreen .glow { display: none !important; }
        #modal:fullscreen .modal-actions { position: fixed !important; top: 15px !important; right: 15px !important; z-index: 99999 !important; }
        #modal:fullscreen #fullscreen { background: #111; color: #fff; }
        #modal:fullscreen .nav { z-index: 100; }
    </style>


    <!-- Galería Principal -->
    <div class="wrap">
        <div id="grid" class="grid">
            <!-- Las tarjetas se insertan aquí vía JS -->
        </div>
    </div>

    <!-- Barra Inferior Fija -->
    <div class="dock">
        <div class="brand"><small>XR</small>300</div>
    </div>

    <!-- Ventana Modal de Detalle -->
    <div class="modal" id="modal" aria-modal="true" role="dialog">
        <div class="modal-actions">
            <button class="fullscreen" id="fullscreen" aria-label="Ver foto en pantalla completa" title="Pantalla completa">⛶</button>
            <button class="close" id="close" aria-label="Cerrar">✕</button>
        </div>
        <div class="box">
            <!-- Lado Izquierdo: Imagen y Navegación -->
            <div class="stage">
                <div class="glow" id="glow"></div>
                <button class="nav l" id="prev" aria-label="Anterior">‹</button>
                <div class="view" id="view"><img id="big" alt=""></div>
                <button class="nav r" id="next" aria-label="Siguiente">›</button>
                <div class="strip" id="strip"></div>
            </div>
            
            <!-- Lado Derecho: Info de Compra y Opciones -->
            <div class="info">
                <div class="top"><span id="sub"></span><span id="count"></span></div>
                <h2 id="code"></h2>
                <div class="buy">
                    <button class="cta" id="buy">ELEGIR DISEÑO</button>
                    <div class="price"><s>S/. 250</s><b id="pr">S/. 180</b><i>-30%</i></div>
                </div>

            </div>
        </div>
    </div>

    <!-- =========================================
         JAVASCRIPT
         ========================================= -->
    <script>
        /* ============ CONFIGURACIÓN: edita solo esta parte ============
           1) Crea una carpeta "imagenes" junto a este archivo HTML.
           2) Guarda ahí tus PNG con el mismo nombre que pongas abajo
              (ej.: AMXF25E01BNR005.png).
           3) Agrega, quita o cambia nombres en la lista DISENOS.      */
        const CARPETA = 'imagenes/';
        const WHATSAPP_NUMERO = '51918322865'; // Reemplaza por tu número con código de país (Perú: 51)
        const PRECIO_FIJO = 'S/. 180'; // Mostrado en grilla
        const DISENOS = [
             'diseño (1)', 'diseño (2)', 'diseño (3)',
            'diseño (4)', 'diseño (5)', 'diseño (6)',
            'diseño (7)', 'diseño (8)', 'diseño (9)',
            'diseño (10)', 'diseño (11)', 'diseño (12)',
            'diseño (13)', 'diseño (14)', 'diseño (15)',
            'diseño (16)', 'diseño (17)', 'diseño (18)',
            'diseño (19)', 'diseño (20)', 'diseño (21)',
            'diseño (22)', 'diseño (23)', 'diseño (24)',
            'diseño (25)', 'diseño (26)', 'diseño (27)',
            'diseño (28)', 'diseño (29)', 'diseño (30)',
            'diseño (31)', 'diseño (32)', 'diseño (33)',
            'diseño (34)', 'diseño (35)', 'diseño (36)',
            'diseño (37)', 'diseño (38)', 'diseño (39)',
            'diseño (40)', 'diseño (41)', 'diseño (42)',
            'diseño (43)', 'diseño (44)', 'diseño (45)',
            'diseño (46)', 'diseño (47)', 'diseño (48)',
            'diseño (49)', 'diseño (50)', 'diseño (51)',
            'diseño (52)', 'diseño (53)', 'diseño (54)',
        ];
        /* ============================================================= */

        // Atajo para getElementById
        const $ = id => document.getElementById(id);
        
        // Preparar estructura de datos
        const slots = DISENOS.map(n => ({
            name: n,
            src: CARPETA + n + '.png',
            ok: true // Asumimos que carga bien inicialmente
        }));
        
        let curIndex = 0; // Índice actual en el modal
        let filteredSlots = []; // Lista de slots válidos para navegación

        // 1. Renderizar la cuadrícula principal
        function renderGrid() {
            const gridContainer = $('grid');
            gridContainer.innerHTML = '';
            
            slots.forEach((s, i) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.tabIndex = 0;
                // Pequeña animación de aparición escalonada
                card.style.animationDelay = Math.min(i, 21) * 25 + 'ms';
                
                // Función si la imagen falla
                const handleImageError = () => {
                    s.ok = false;
                    card.className = 'card slot';
                    card.style.cursor = 'default';
                    card.innerHTML = `
                        <div class="thumb">
                            <div>Falta<br>${s.name}.png</div>
                        </div>
                        <div class="meta">
                            <span>${s.name}</span><span>${PRECIO_FIJO}</span>
                        </div>
                    `;
                };

                // Contenido normal de la tarjeta
                card.innerHTML = `
                    <div class="thumb">
                        <img alt="${s.name}" id="img-${i}">
                    </div>
                    <div class="meta">
                        <span>${s.name}</span><span>${PRECIO_FIJO}</span>
                    </div>
                `;

                const img = card.querySelector('img');
                img.onerror = handleImageError;
                img.src = s.src; // Asignar fuente para iniciar carga

                // Eventos de clic/teclado para abrir modal
                card.onclick = () => { if (s.ok) openModal(i); };
                card.onkeydown = e => { if (e.key === 'Enter') card.click(); };
                
                gridContainer.appendChild(card);
            });
        }

        // 2. Mostrar imagen en el Modal
        function showInModal(k, dir = 0) {
            // Asegurar que el índice sea circular
            curIndex = (k + filteredSlots.length) % filteredSlots.length;
            
            const slotData = slots[filteredSlots[curIndex]];
            const bigImg = $('big');
            
            // Actualizar elementos visuales del modal
            bigImg.src = slotData.src;
            $('glow').style.backgroundImage = `url(${slotData.src})`;
            $('code').textContent = slotData.name;
            $('sub').textContent = 'AMX • F25 E01';
            $('count').textContent = `${curIndex + 1} / ${filteredSlots.length}`;
            
            // Resetear zoom
            $('view').classList.remove('zoom');
            
            // Animación de entrada de la imagen principal
            bigImg.animate([
                { opacity: 0, transform: `translateX(${dir * 90}px) scale(.9) rotate(${dir * 2}deg)` },
                { opacity: 1, transform: 'none' }
            ], { duration: 450, easing: 'cubic-bezier(.2,.9,.25,1)' });

            // Actualizar tira de miniaturas
            const strip = $('strip');
            strip.innerHTML = '';
            filteredSlots.forEach((j, n) => {
                const thumb = document.createElement('img');
                thumb.src = slots[j].src;
                thumb.className = n === curIndex ? 'on' : '';
                thumb.onclick = () => showInModal(n, n > curIndex ? 1 : -1);
                strip.appendChild(thumb);
            });

            // Asegurar que la miniatura activa sea visible en el scroll
            if (strip.children[curIndex]) {
                strip.children[curIndex].scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
            }
        }

        // 3. Abrir Modal
        function openModal(i) {
            // Filtrar solo los diseños que cargaron correctamente para la navegación
            filteredSlots = slots.map((s, k) => s.ok ? k : -1).filter(k => k >= 0);
            
            if (filteredSlots.length === 0) return; // No hay nada que mostrar
            
            // Encontrar el índice en la lista filtrada basado en el índice global original
            const indexInFiltered = filteredSlots.indexOf(i);
            
            $('modal').classList.add('open');
            document.body.style.overflow = 'hidden'; // Evitar scroll de fondo
            
            showInModal(indexInFiltered);
        }

        // 4. Cerrar Modal
        async function closeModal() {
            if (document.fullscreenElement) await document.exitFullscreen();
            $('modal').classList.remove('open');
            document.body.style.overflow = ''; // Restaurar scroll
        }

        // =========================================
        // EVENT LISTENERS
        // =========================================

        // Clicks en botones de navegación
        $('prev').onclick = () => showInModal(curIndex - 1, -1);
        $('next').onclick = () => showInModal(curIndex + 1, 1);
        // Cierre del modal
        $('close').onclick = closeModal;
        $('fullscreen').onclick = async () => {
            try {
                if (document.fullscreenElement === $('modal')) {
                    await document.exitFullscreen();
                } else {
                    $('view').classList.remove('zoom');
                    await $('modal').requestFullscreen();
                }
            } catch (error) {
                console.error('No se pudo cambiar pantalla completa:', error);
            }
        };
        document.addEventListener('fullscreenchange', () => {
            const activo = document.fullscreenElement === $('modal');
            $('fullscreen').textContent = activo ? '⤢' : '⛶';
            $('fullscreen').title = activo ? 'Salir de pantalla completa' : 'Pantalla completa';
            $('fullscreen').setAttribute('aria-label', $('fullscreen').title);
        });
        $('modal').onclick = e => { if (e.target ===$('modal')) closeModal(); };
        
        // Zoom de imagen al hacer clic
        $('view').onclick = () =>$('view').classList.toggle('zoom');

        // Navegación por teclado
        addEventListener('keydown', e => {
            if (!$('modal').classList.contains('open')) return;
            switch(e.key) {
                case 'ArrowLeft': showInModal(curIndex - 1, -1); break;
                case 'ArrowRight': showInModal(curIndex + 1, 1); break;
                case 'Escape': closeModal(); break;
            }
        });

        // Soporte para gestos táctiles (swipe) en móviles
        let touchStartX = 0;
        $('view').addEventListener('touchstart', e => touchStartX = e.touches[0].clientX, { passive: true });$('view').addEventListener('touchend', e => {
            const diff = e.changedTouches[0].clientX - touchStartX;
            if (Math.abs(diff) > 50) { // Umbral mínimo de movimiento
                showInModal(curIndex + (diff < 0 ? 1 : -1), diff < 0 ? 1 : -1);
            }
        });

        // Enviar el diseño seleccionado por WhatsApp mediante enlace público.
        $('buy').onclick = () => {
            const seleccionado = slots[filteredSlots[curIndex]];
            if (!seleccionado) return;
            const urlImagen = new URL(seleccionado.src, window.location.href).href;
            const mensaje = `Hola, quiero comprar este diseño:\nDiseño: ${seleccionado.name}\nPrecio: ${PRECIO_FIJO}\nFoto: ${urlImagen}`;
            const enlace = `https://wa.me/918322865?text=${encodeURIComponent(mensaje)}`;
            window.open(enlace, '_blank', 'noopener,noreferrer');
        };

        // Inicializar
        renderGrid();

    </script>
</body>
</html>
