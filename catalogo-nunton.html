
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Catálogo de Motos</title>

    <style>

        /* =====================================
           CONFIGURACIÓN GENERAL
        ===================================== */

        :root {
            --nieve-opacidad: 0.55;
            --nieve-color: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;

            background-color: #000;
        }

        /* =====================================
           FONDO DE PANTALLA COMPLETA
        ===================================== */

        
.hero {
    position: relative;

    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    /* FONDO CON OSCURECIMIENTO */
    background-image:
        linear-gradient(
            rgba(0, 0, 0, 0.7),
            rgba(0, 0, 0, 0.7)
        ),
        url("NUNTON.jpeg");

    /* CENTRAR IMAGEN */
    background-position: center center;

    /* CUBRIR TODA LA PANTALLA */
    background-size: cover;

    background-repeat: no-repeat;

    padding: 110px 20px 50px;
}


        /* =====================================
           HEADER Y LOGO
        ===================================== */

        .header {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            z-index: 100;
        }

        .contenedor {
            width: 90%;
            max-width: 1200px;
            margin: auto;
        }

        .header-contenido {
            display: flex;
            align-items: center;
            justify-content: space-between;

            min-height: 90px;
        }

        .logo img {
            width: 180px;
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* =====================================
           MENÚ
        ===================================== */

        .menu {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .menu a {
            color: white;
            text-decoration: none;

            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;

            transition: 0.3s;
        }

        .menu a:hover {
            color: #ff0505;
        }

        .menu-btn {
            display: none;

            background: none;
            border: none;

            color: white;
            font-size: 30px;

            cursor: pointer;
        }

        /* =====================================
           CONTENIDO PRINCIPAL
        ===================================== */

        .hero-contenido {
            position: relative;
            z-index: 2;

            width: 100%;
            max-width: 850px;

            color: white;
            font-family: Arial, sans-serif;
        }

        .hero-pequeno {
            color: #f10606;

            font-size: 16px;
            font-weight: bold;

            letter-spacing: 3px;

            margin-bottom: 15px;
        }

        .hero h1 {
            font-size: clamp(36px, 6vw, 65px);
            font-weight: 800;

            margin: 0 0 20px;
        }

        .hero-contenido > p:not(.hero-pequeno) {
            font-size: 18px;
            line-height: 1.7;

            max-width: 650px;

            margin: 0 auto 30px;
        }

        /* =====================================
           BOTONES
        ===================================== */

        .hero-botones {
            display: flex;
            align-items: center;
            justify-content: center;

            flex-wrap: wrap;
            gap: 15px;
        }

        .btn {
            display: inline-block;

            padding: 15px 30px;

            border-radius: 8px;

            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;

            text-decoration: none;

            transition: 0.3s;
        }

        .btn-principal {
            background: #ff0101;
            color: #ffffff;
        }

        .btn-principal:hover {
            background: #d35c5c;
            transform: translateY(-3px);
        }

        .btn-whatsapp {
            background: #25d366;
            color: white;
        }

        .btn-whatsapp:hover {
            background: #1ebe5d;
            transform: translateY(-3px);
        }

        /* =====================================
           PARTÍCULAS DE NIEVE
        ===================================== */

        #nieve-contenedor {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            pointer-events: none;

            z-index: 9999;
        }

        .copo-nieve {
            position: absolute;
            top: -20px;

            background: var(--nieve-color);

            border-radius: 50%;

            opacity: var(--nieve-opacidad);

            box-shadow:
                0 0 5px rgba(255,255,255,0.5);

            animation: caer-nieve linear infinite;

            will-change: transform;
        }

        @keyframes caer-nieve {

            0% {
                transform: translate3d(
                    0,
                    -20px,
                    0
                );
            }

            100% {
                transform: translate3d(
                    var(--desplazamiento),
                    105vh,
                    0
                );
            }

        }

        /* =====================================
           ADAPTACIÓN PARA CELULARES
        ===================================== */

        @media (max-width: 768px) {

            .header-contenido {
                min-height: 75px;
            }

            .logo img {
                width: 145px;
            }

            .menu-btn {
                display: block;
            }

            .menu {
                display: none;

                position: absolute;
                top: 75px;
                left: 0;

                width: 100%;

                background: rgba(0,0,0,0.95);

                flex-direction: column;
                align-items: center;

                gap: 0;

                padding: 15px 0;
            }

            .menu.activo {
                display: flex;
            }

            .menu a {
                width: 100%;

                padding: 15px;

                text-align: center;
            }

            .hero {
                padding: 110px 20px 40px;
            }

            .hero-pequeno {
                font-size: 13px;
            }

            .hero-contenido > p:not(.hero-pequeno) {
                font-size: 16px;
            }

            .hero-botones {
                gap: 12px;
            }

            .btn {
                padding: 13px 22px;
                font-size: 14px;
            }

        }

    </style>

</head>

<body>

<!-- =====================================
     PARTÍCULAS DE NIEVE
===================================== -->

<div id="nieve-contenedor"></div>

<!-- =====================================
     HEADER
===================================== -->

<header class="header">

    <div class="contenedor header-contenido">

        <a href="index.html" class="logo">
            <img src="NUNTON-LETRAS.png" alt="Logo">
        </a>

        <button class="menu-btn" id="menuBtn">
            ☰
        </button>

        <nav class="menu" id="menu">



        </nav>

    </div>

</header>

<!-- =====================================
     SECCIÓN PRINCIPAL
===================================== -->

<section class="hero">

    <div class="hero-contenido">

        <p class="hero-pequeno">
            CATÁLOGO DE STICKERS
        </p>

        <h1>
            Personaliza tu moto
        </h1>

        <p>
            Encuentra tu modelo, revisa los diseños disponibles
            y solicita tu pedido directamente.
        </p>

        <div class="hero-botones">

            <a href="Catalogo.html" class="btn btn-principal">
                Ver catálogos
            </a>

            <a
                href="https://wa.me/51918322865"
                target="_blank"
                class="btn btn-whatsapp"
                rel="noopener noreferrer"
            >
                WhatsApp
            </a>

        </div>

    </div>

</section>

<!-- =====================================
     JAVASCRIPT
===================================== -->

<script>

    /* =====================================
       CONFIGURACIÓN DE COPITOS DE NIEVE

       MODIFICA ESTOS VALORES A TU GUSTO
    ===================================== */

    const configuracionNieve = {

        cantidad: 100,

        // OPACIDAD
        // 0 = invisible
        // 0.5 = semitransparente
        // 1 = totalmente visible

        opacidad: 0.55,

        // TAMAÑO DE LOS COPITOS

        tamanoMin: 2,
        tamanoMax: 6,

        // VELOCIDAD DE CAÍDA
        // Menos segundos = más rápido

        velocidadMin: 6,
        velocidadMax: 14

    };

    /* =====================================
       CREACIÓN DE COPITOS
    ===================================== */

    function crearNieve() {

        const contenedor =
            document.getElementById("nieve-contenedor");

        if (!contenedor) return;

        contenedor.innerHTML = "";

        for (
            let i = 0;
            i < configuracionNieve.cantidad;
            i++
        ) {

            const copo = document.createElement("div");

            copo.classList.add("copo-nieve");

            const tamano =
                Math.random() *
                (
                    configuracionNieve.tamanoMax -
                    configuracionNieve.tamanoMin
                ) +
                configuracionNieve.tamanoMin;

            const velocidad =
                Math.random() *
                (
                    configuracionNieve.velocidadMax -
                    configuracionNieve.velocidadMin
                ) +
                configuracionNieve.velocidadMin;

            const posicion =
                Math.random() * 100;

            const desplazamiento =
                (Math.random() - 0.5) * 100;

            copo.style.left =
                posicion + "%";

            copo.style.width =
                tamano + "px";

            copo.style.height =
                tamano + "px";

            copo.style.opacity =
                configuracionNieve.opacidad;

            copo.style.animationDuration =
                velocidad + "s";

            copo.style.animationDelay =
                -(Math.random() * velocidad) + "s";

            copo.style.setProperty(
                "--desplazamiento",
                desplazamiento + "px"
            );

            contenedor.appendChild(copo);

        }

    }

    /* =====================================
       MENÚ PARA CELULARES
    ===================================== */

    const menuBtn =
        document.getElementById("menuBtn");

    const menu =
        document.getElementById("menu");

    menuBtn.addEventListener("click", function() {

        menu.classList.toggle("activo");

    });

    /* =====================================
       INICIAR EFECTOS
    ===================================== */

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            crearNieve();

        }
    );

</script>

</body>
</html>
