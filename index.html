<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUNTON</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #00aaff;
    }

    .splash {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgb(248, 1, 1);
      overflow: hidden;
      /* CAMBIO 1: Imagen de fondo con capa oscura por encima para legibilidad */
      background: 
        linear-gradient(rgba(3, 7, 9, 0.65), rgba(3, 7, 9, 0.75)), 
        url('NUNTON.jpeg') no-repeat center center / cover;
    }

    /* Capa opaca adicional */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .38);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(900px, 90%);
      text-align: center;
      margin-top: -20px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 3px;
      transition: transform 0.8s ease, opacity 0.8s ease;
    }

    /* Estilo del logo principal */
    .brand-icon {
      display: flex;
      align-items: center;
    }

    .brand-icon img {
      width: 80px; /* Ajusta el tamaño de tu logo si es necesario */
      height: auto;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.25));
    }

    .brand-name {
      font-size: clamp(30px, 5vw, 58px);
      font-weight: 800;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #eeebe8;
      font-size: clamp(17px, 2.5vw, 29px);
      font-weight: 30;
      letter-spacing: 5px;
      margin-left: 45px;
      transition: transform 0.8s ease, opacity 0.8s ease;
    }

    .loader-area {
      width: min(650px, 90%);
      margin: 70px auto 0;
      transition: transform 0.8s ease, opacity 0.8s ease;
    }

    .loader-icon {
      width: 54px;
      height: 54px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: float 1.5s ease-in-out infinite;
    }

    /* Estilo para la imagen del icono animado arriba de la barra */
    .loader-icon img {
      width: 42px;
      height: auto;
      filter: drop-shadow(0 0 6px rgba(250, 250, 249, 0.35));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* BARRA DE PROGRESO Y EFECTO DE LUZ */
    .progress-track {
      position: relative;
      width: 100%;
      height: 5px; /* Ligeramente más alta para resaltar la luz */
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      overflow: visible;
      box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.8), 0 0 10px rgba(0, 0, 0, 0.5);
    }
    .progress-bar {
      position: absolute;
      left: 0;
      top: 0;
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff9000, #ebb403, #ffffff);
      border-radius: 20px;
      /* Resplandor neón dorado/blanco intenso */
      box-shadow: 
        0 0 10px #ff0000, 
        0 0 20px #e20000, 
        0 0 35px rgba(255, 255, 255, 0.9);
      overflow: hidden;
    }

    /* Rayo de luz brillante pasando continuamente dentro de la barra */
    .progress-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg, 
        transparent 0%, 
        rgba(255, 255, 255, 0.9) 50%, 
        transparent 100%
      );
      animation: destello 1.2s infinite;
    }

    @keyframes destello {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .progress-logo {
      position: absolute;
      top: -20px;
      left: 0%;
      width: 40px;
      height: 40px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Estilo para el logo en movimiento sobre la barra de carga */
    .progress-logo img {
      width: 32px;
      height: auto;
      filter: drop-shadow(0 0 7px rgba(245, 242, 242, 0.4));
    }

    .status {
      margin-top: 13px;
      color: rgba(241, 236, 236, 0.68);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .percent {
      margin-top: 8px;
      color: #f0eee9;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .footer {
      position: absolute;
      z-index: 2;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(236, 240, 1, 0.35);
      font-size: 10px;
      letter-spacing: 2px;
    }

    /* ANIMACIONES DE SALIDA */
    .exit-up {
      animation: fadeOutUp 0.8s forwards ease-in-out;
    }

    .exit-down {
      animation: fadeOutDown 0.8s forwards ease-in-out;
    }

    @keyframes fadeOutUp {
      0% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(-100px);
      }
    }

    @keyframes fadeOutDown {
      0% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(100px);
      }
    }

    @media (max-width: 600px) {
      .subtitle {
        margin-left: 0;
        letter-spacing: 3px;
      }

      .loader-area {
        margin-top: 50px;
      }
    }
  </style>
</head>

<body>


<!-- COPITOS DE NIEVE -->
<div id="nieve-contenedor"></div>

<style>
    /* CONFIGURACIÓN DE NIEVE */
    :root {
        --nieve-color: #ffffff;
    }

    #nieve-contenedor {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
        z-index: 9999;
    }

    .copo-nieve {
        position: absolute;
        top: -20px;
        background: var(--nieve-color);
        border-radius: 50%;
        box-shadow: 0 0 5px rgba(255,255,255,0.5);
        animation: caer-nieve linear infinite;
        will-change: transform;
    }

    @keyframes caer-nieve {
        0% {
            transform: translate3d(0, -20px, 0);
        }

        100% {
            transform: translate3d(
                var(--desplazamiento),
                105vh,
                0
            );
        }
    }
</style>

<script>
    /* =====================================
       CONFIGURACIÓN DE COPITOS
       MODIFICA ESTOS VALORES
    ===================================== */

    const configuracionNieve = {
        cantidad: 70,       // Cantidad de copitos
        opacidad: 0.55,     // 0 invisible / 1 visible
        tamanoMin: 2,       // Tamaño mínimo
        tamanoMax: 8,       // Tamaño máximo
        velocidadMin: 6,    // Menor = más rápido
        velocidadMax: 14    // Mayor = más lento
    };

    /* CREAR COPITOS */

    function crearNieve() {

        const contenedor =
            document.getElementById("nieve-contenedor");

        if (!contenedor) return;

        contenedor.innerHTML = "";

        for (let i = 0; i < configuracionNieve.cantidad; i++) {

            const copo = document.createElement("div");
            copo.classList.add("copo-nieve");

            const tamano =
                Math.random() *
                (configuracionNieve.tamanoMax -
                 configuracionNieve.tamanoMin) +
                configuracionNieve.tamanoMin;

            const velocidad =
                Math.random() *
                (configuracionNieve.velocidadMax -
                 configuracionNieve.velocidadMin) +
                configuracionNieve.velocidadMin;

            const posicion = Math.random() * 100;
            const desplazamiento = (Math.random() - 0.5) * 100;

            copo.style.left = posicion + "%";
            copo.style.width = tamano + "px";
            copo.style.height = tamano + "px";

            copo.style.opacity = configuracionNieve.opacidad;

            copo.style.animationDuration = velocidad + "s";

            copo.style.animationDelay =
                -(Math.random() * velocidad) + "s";

            copo.style.setProperty(
                "--desplazamiento",
                desplazamiento + "px"
            );

            contenedor.appendChild(copo);
        }
    }

    /* INICIAR NIEVE */

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", crearNieve);
    } else {
        crearNieve();
    }
</script>




  <main class="splash">
    <div class="overlay"></div>

    <section class="content">
      <div class="brand" id="brand">
        <!-- CAMBIO 2: Logo PNG junto al nombre -->
        <div class="brand-icon">
          <img src="LOGO.png" alt="Terranova Logo">
        </div>
        <div class="brand-name">NUNTON TUNING</div>
      </div>

      <div class="Arial" id="subtitle">Especialistas en stickers para motos. Fabricación y distribución desde CHACHAPOYAS</div>

      <div class="loader-area" id="loaderArea">
        <!-- CAMBIO 3: Logo PNG flotante -->
        <div class="loader-icon">
          <img src="LOGO.png" alt="Cargando">
        </div>

        <div class="progress-track" id="track">
          <div class="progress-bar" id="bar"></div>
          <!-- CAMBIO 4: Logo PNG que avanza en la barra -->
          <div class="progress-logo" id="logo">
         
          </div>
        </div>

        <div class="status" id="status">
          Sincronizando datos de producción en tiempo real...
        </div>

        <div class="percent" id="percent">0%</div>
      </div>
    </section>

    <div class="footer">developer - dilver - mendoza</div>
  </main>

  <script>
    const DURACION_CARGA = 5000;
    const PAGINA_DESTINO = "catalogo-nunton.html";

    const bar = document.getElementById("bar");
    const logo = document.getElementById("logo");
    const percent = document.getElementById("percent");
    const status = document.getElementById("status");
    const track = document.getElementById("track");
    const brand = document.getElementById("brand");
    const subtitle = document.getElementById("subtitle");
    const loaderArea = document.getElementById("loaderArea");

    const inicio = performance.now();

    function cargar(tiempoActual) {
      const transcurrido = tiempoActual - inicio;
      const progreso = Math.min(transcurrido / DURACION_CARGA, 1);
      const porcentaje = Math.round(progreso * 100);

      bar.style.width = porcentaje + "%";
      logo.style.left = porcentaje + "%";
      percent.textContent = porcentaje + "%";

      if (porcentaje < 100) {
        requestAnimationFrame(cargar);
      } else {
        status.textContent = "Carga completada. Iniciando sistema...";
        
        // Activar animaciones de salida
        brand.classList.add("exit-up");
        subtitle.classList.add("exit-up");
        loaderArea.classList.add("exit-down");

        // Redirigir una vez finalizada la animación
        setTimeout(() => {
          window.location.href = PAGINA_DESTINO;
        }, 800);
      }
    }

    requestAnimationFrame(cargar);
  </script>

</body>
</html>
